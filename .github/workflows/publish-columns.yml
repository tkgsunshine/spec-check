name: Auto Publish SEO Columns (10:00 & 18:00 JST)

on:
  schedule:
    # 01:00 UTC = 10:00 JST, 09:00 UTC = 18:00 JST
    - cron: '0 1,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Generate and Schedule Daily Column Article
        run: node scripts/generate-column.js

      - name: Verify Build Success
        run: npm run build

      - name: Commit and Push New Column to GitHub
        run: |
          git config --global user.name "Moon & Lotus Automated Bot"
          git config --global user.email "bot@tsuki-to-ren.com"
          git add src/data/columnsData.ts
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(seo): auto publish daily column article at $(date -u +'%Y-%m-%d %H:%M JST')" && git push)
